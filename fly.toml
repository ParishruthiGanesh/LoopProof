# Fly.io configuration for a shareable LoopProof demonstration.
# See docs/DEPLOY.md. Change `app` to a name of your own before deploying.

app = "loopproof-demo"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  LOOPPROOF_DATABASE_PATH = "/data/loopproof.db"
  LOOPPROOF_UPLOAD_DIR = "/data/uploads"
  # Set to "true" only on a 1 GB machine or larger.
  LOOPPROOF_EMBED_CHAIN = "false"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response.headers]
    X-Content-Type-Options = "nosniff"

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  path = "/api/status"
  timeout = "5s"

# The database and uploaded photographs live here.
[[mounts]]
  source = "loopproof_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb" # raise to 1gb if you enable LOOPPROOF_EMBED_CHAIN
